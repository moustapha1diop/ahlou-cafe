<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ahlou Café Touba Sourah</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- Écran de connexion -->
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-mug-hot"></i>
                <h1>Ahlou Café</h1>
                <p>Dashboard d'administration</p>
            </div>
            <form id="login-form">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Se connecter</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard" style="display:none;">
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-logo">
                    <i class="fas fa-mug-hot"></i>
                    <span>Ahlou Café — Dashboard</span>
                </div>
                <div>
                    <a href="index.html" target="_blank" class="btn-secondary"><i class="fas fa-external-link-alt"></i> Voir le site</a>
                    <button id="logout-btn" class="btn-secondary"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <section class="upload-card">
                <h2><i class="fas fa-upload"></i> Ajouter une image ou une vidéo</h2>
                <form id="upload-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Titre (optionnel)</label>
                            <input type="text" id="title" placeholder="Ex: Notre stand ce matin">
                        </div>
                        <div class="form-group">
                            <label for="section">Où afficher ce média ?</label>
                            <select id="section">
                                <option value="live" selected>Nouveautés (page Média)</option>
                                <option value="magal2022">Magal 2022</option>
                                <option value="magal2023">Magal 2023</option>
                                <option value="magal2024">Magal 2024</option>
                                <option value="magal2025">Magal 2025</option>
                                <option value="magal2026">Magal 2026</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="file">Fichier (image ou vidéo)</label>
                        <input type="file" id="file" accept="image/*,video/*" required>
                    </div>
                    <button type="submit" id="upload-btn"><i class="fas fa-cloud-upload-alt"></i> Publier sur le site</button>
                    <p id="upload-msg" class="upload-msg"></p>
                    <div id="upload-progress-wrap" class="progress-wrap" style="display:none;">
                        <div id="upload-progress" class="progress-bar"></div>
                    </div>
                </form>
            </section>

            <section class="list-card">
                <div class="list-card-header">
                    <h2><i class="fas fa-photo-video"></i> Médias publiés</h2>
                    <select id="filter-section">
                        <option value="">Toutes les sections</option>
                        <option value="live">Nouveautés</option>
                        <option value="magal2022">Magal 2022</option>
                        <option value="magal2023">Magal 2023</option>
                        <option value="magal2024">Magal 2024</option>
                        <option value="magal2025">Magal 2025</option>
                        <option value="magal2026">Magal 2026</option>
                    </select>
                </div>
                <div id="media-grid" class="media-grid"></div>
                <p id="media-empty" style="display:none; text-align:center; color:#888; padding: 30px;">Aucun média dans cette section.</p>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
